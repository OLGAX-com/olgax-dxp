name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Uses the sqlite/no-secret defaults in payload.config.ts (see
      # apps/demo/.env.example) - no CI secrets needed for a build check.
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
