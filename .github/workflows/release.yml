name: Release

# Prefers npm Trusted Publishing (OIDC, via the id-token permission below).
# Trusted Publisher can only be configured per-package on npmjs.com after a
# package's first publish, so NPM_TOKEN stays as a fallback for that bootstrap
# publish - npm's CLI tries OIDC first and falls back to the token automatically.
# Once every package has a Trusted Publisher configured (package Settings ->
# Trusted Publisher -> GitHub Actions -> org "OLGAX-com", repo "olgax-dxp",
# workflow filename "release.yml"), the NPM_TOKEN secret can be removed.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >=11.5.1. Stay on 11: npm 12 makes `npm info --json`
      # return an array, which Changesets 2.x misreads as "nothing published yet".
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Opens/updates a "Version Packages" PR when changesets are pending;
      # once that PR is merged (no changesets left, versions already bumped),
      # publishes every non-ignored package in .changeset/config.json to npm
      # (via OIDC, see permissions above) and creates a GitHub Release per package.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
