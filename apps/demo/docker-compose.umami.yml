# Optional: a self-hosted Umami instance (https://umami.is) for broader analytics -
# countries, sessions/duration, devices, browsers, referrers, UTM campaigns - than the
# built-in page-view counter (see lib/analytics.ts) covers on its own. Not required for
# create-olgax-site's zero-config default; only run this if you want it.
#
# Usage:
#   docker compose -f docker-compose.umami.yml up -d
# Then open http://localhost:3001 (or UMAMI_PORT, if set), log in with admin /
# umami (change the password immediately), add a website, and copy its
# Website ID into .env - see .env.example.
services:
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    ports:
      - "${UMAMI_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      APP_SECRET: replace-with-a-random-string # generate with: openssl rand -hex 32
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  umami-db-data:
